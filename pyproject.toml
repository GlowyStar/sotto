[project]
name = "sotto"
version = "0.1.0"
description = "End-to-end encrypted messenger with a content-blind relay."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50,<51",
    "protobuf>=7.35.1,<8",
    "websockets>=17.4,<18",
]

[project.scripts]
sotto-relay = "sotto.relay.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85,<1.86",
    "hypothesis>=6.170,<7",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
    "types-protobuf>=7.35,<8",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 95
extend-exclude = ["src/sotto/proto/*_pb2.py", "src/sotto/proto/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "sotto.proto.sotto_pb2"
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "stand: also runs against the Compose stand when RELAY_URL is set",
]
